<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No remote font CDN: Bricolage Grotesque + Instrument Sans are bundled
      locally via @fontsource in src/renderer/global.css. The old Inter <link>
      was unused and blocked first paint until it timed out on an offline till.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com;"
    />
    <title>Nexora Solution POS</title>
  </head>
  <body class="bg-surface text-content antialiased">
    <div id="root"></div>
    <script type="module" src="./src/renderer/main.tsx"></script>
  </body>
</html>
